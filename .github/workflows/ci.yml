name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, Mypy y Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar Ruff
        run: python -m ruff check app tests migrations

      - name: Ejecutar Mypy
        run: python -m mypy app

      - name: Ejecutar pruebas y cobertura
        run: python -m pytest
