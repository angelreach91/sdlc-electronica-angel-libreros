services:
  - type: web
    name: sensorhub-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db
          property: connectionString

databases:
  - name: sensorhub-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: sensorhub
    user: sensor
    ipAllowList: []
